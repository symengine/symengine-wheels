{% set version = "0.15.0" %}
{% set cxx_version = "0.15.0" %}

package:
  name: symengine-wheels
  version: {{ version }}

source:
  - url: https://github.com/symengine/symengine.py/releases/download/v{{ version }}/symengine.py-{{ version }}.tar.gz
    sha256: 5fac75a1b347308ba8b6e33b0bf74c5235446e268b3d023f80c02e1a873a7c18
    folder: python
    patches:
      - 6344a52.patch

  - url: https://github.com/symengine/symengine/releases/download/v{{ cxx_version }}/symengine-{{ cxx_version }}.tar.gz
    sha256: 9f75f0367221abd88b9b60ef7b104b4aa1e34e99d3152c3df2bb2467bad2f04f
    folder: cxx

build:
  number: 0
  skip: true    # [py<311 or (is_abi3 and py>311)]
  python_version_independent: true  # [is_abi3 and py>=311]
  script_env:
    - SKBUILD_WHEEL_PY_API=cp311   # [is_abi3 and py>=311]
  ignore_run_exports_from:
    - gmp
    - mpfr
    - mpc
    - libflint
    - llvmdev
    - zlib
    - zstd
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}

requirements:
  build:
    - cmake <4
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make   # [unix]
    - ninja  # [win]
    - patchelf        # [linux]
    - python          # [build_platform != target_platform]
    - cross-python_{{ target_platform }}      # [build_platform != target_platform]
    - scikit-build-core  # [build_platform != target_platform]
    - setuptools-scm     # [build_platform != target_platform]
    - cython-cmake       # [build_platform != target_platform]
    - unzip           # [unix]
    - m2-unzip        # [win]
    - m2-sed          # [win]
    - cython >=3.1
  host:
    - gmp
    - mpfr
    - mpc
    - libflint
    - winpthreads-devel  # [win]
    - llvmdev <17
    # for llvm
    - zlib
    # for llvm
    - zstd
    - python
    - python-abi3                # [is_abi3 and py>=311]
    - scikit-build-core
    - setuptools-scm
    - cython-cmake
    - cython >=3.1  # [build_platform == target_platform]
    - pip
    - auditwheel      # [linux]
    - delocate        # [win or osx]
  run:
    - python

test:
  requires:
    - pytest
    - sympy
    - numpy   # [not is_freethreading]
    - abi3audit                  # [is_abi3 and py>=311]
  commands:
    - abi3audit ${SP_DIR}/symengine/lib/symengine_wrapper.abi3.so -s -v --assume-minimum-abi3 3.11    # [unix and is_abi3 and py>=311]
    - abi3audit %SP_DIR%/symengine/lib/symengine_wrapper.pyd -s -v --assume-minimum-abi3 3.11         # [win and is_abi3 and py>=311]

about:
  home: https://github.com/symengine/symengine.py
  license: MIT
  license_file: python/LICENSE
  summary: Python wrappers for SymEngine, a fast symbolic manipulation library, written in C++

extra:
  recipe-maintainers:
    - isuruf
    - certik
